name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release

      - name: Run integration & unit tests
        run: cargo test --verbose

      - name: Smoke test CLI subcommands
        run: |
          cargo run --release --bin telemetria -- --version
          cargo run --release --bin telemetria -- status --offline --json
          cargo run --release --bin telemetria -- tariffs --offline
          cargo run --release --bin telemetria -- mining --offline
          cargo run --release --bin telemetria -- benchmark --iterations 3 --offline
