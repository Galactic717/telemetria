[package]
name = "telemetria"
version = "2.0.0"
edition = "2021"
authors = ["Galactic717"]
description = "High-performance real-time PC hardware telemetry (CPU/GPU/RAM/NVMe/Net), AC wall power analyzer, live internet electricity tariff auto-updater, and GPU server rental / mining profitability CLI & TUI in Rust"
license = "MIT"
repository = "https://github.com/Galactic717/telemetria"
readme = "README.md"
keywords = ["telemetry", "hardware-monitor", "electricity-cost", "gpu-mining", "tui"]
categories = ["command-line-utilities", "hardware-support", "visualization"]
default-run = "telemetria"

[[bin]]
name = "telemetria"
path = "src/main.rs"

[[bin]]
name = "tlm"
path = "src/bin/tlm.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
nvml-wrapper = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "native-certs", "json"] }
regex = "1.11"
csv = "1.3"
dirs = "5.0"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
